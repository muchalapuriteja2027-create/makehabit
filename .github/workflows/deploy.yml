name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Permissions required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Dependency audit summary (report only)
        continue-on-error: true
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node <<'NODE'
          const fs = require('node:fs');
          try {
            const report = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
            console.log('Dependency audit counts:', JSON.stringify(report.metadata?.vulnerabilities || {}));
            for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
              const advisories = (item.via || [])
                .filter((entry) => typeof entry === 'object')
                .map((entry) => entry.title || entry.url || 'advisory')
                .join('; ');
              console.log(
                `${String(item.severity).toUpperCase()} ${name} | direct=${item.isDirect} | range=${item.range} | fixAvailable=${JSON.stringify(item.fixAvailable)} | ${advisories}`
              );
            }
          } catch (error) {
            console.log('Could not parse npm audit report:', error.message);
          }
          NODE

      - name: Type-check
        run: npm run lint

      - name: Build Vite application
        env:
          VITE_CLARITY_PROJECT_ID: z3mv17kk7c
          VITE_GOOGLE_SITE_VERIFICATION: ${{ vars.VITE_GOOGLE_SITE_VERIFICATION }}
        run: npm run build

      - name: Upload Pages artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
